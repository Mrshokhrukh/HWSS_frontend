user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name thepemasystem.gov.bt;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy for core service
        location /api/core/ {
            proxy_pass http://hwss-core.default.svc.cluster.local:8123/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static and media for core service
        location /api/core/static/ {
            proxy_pass http://hwss-core.default.svc.cluster.local:8123/api/core/static/;
        }

        location /api/core/media/ {
            proxy_pass http://hwss-core.default.svc.cluster.local:8123/api/core/media/;
        }

        # Proxy for screening service
        location /api/screening/ {
            proxy_pass http://hwss-qbs.default.svc.cluster.local:8686/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Static and media for screening service
        location /api/screening/static/ {
            proxy_pass http://hwss-qbs.default.svc.cluster.local:8686/api/screening/static/;
        }

        location /api/screening/media/ {
            proxy_pass http://hwss-qbs.default.svc.cluster.local:8686/api/screening/media/;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}