<style>
  :root {
    --primary-color: #004a80;
    --secondary-color: #2c3e50;
    --background-color: #f8f9fa;
    --card-background: #ffffff;
    --text-color: #333333;
  }


  .card {
    border: none;
    border-radius: 15px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease-in-out;
    background-color: var(--card-background);
  }

  .card:hover {
    transform: translateY(-5px);
  }

  .card-header {
    background-color: var(--primary-color);
    color: #ffffff;
    border-top-left-radius: 15px;
    border-top-right-radius: 15px;
  }

  .crd-img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid var(--primary-color);
  }

  .btn-primary {
    background-color: var(--primary-color);
    border-color: var(--primary-color);
  }

  .btn-primary:hover {
    background-color: #2980b9;
    border-color: #2980b9;
  }

  .btn-secondary {
    background-color: var(--secondary-color);
    border-color: var(--secondary-color);
  }

  .btn-secondary:hover {
    background-color: #34495e;
    border-color: #34495e;
  }

  .loading-overlay {
    background-color: rgba(255, 255, 255, 0.8);
  }

  .loader {
    border-top-color: var(--primary-color);
  }

  #parliamentFilter,
  #constituencyFilter {
    border-color: var(--primary-color);
  }

  .modal-content {
    border-radius: 15px;
  }

  .modal-header {
    background-color: var(--primary-color);
    color: #ffffff;
    border-top-left-radius: 15px;
    border-top-right-radius: 15px;
  }

  .modal-body img {
    border-radius: 15px;
  }
</style>

<div class="container">
  <div class="card mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-center">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input type="text" class="form-control" placeholder="Search members...">
          </div>
        </div>
        <div class="col-md-3">
          <select id="parliamentFilter" class="form-select">
            <option value="First Parliament">First Parliament</option>
            <option value="Second Parliament">Second Parliament</option>
            <option value="Third Parliament" selected="">Third Parliament</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="constituencyFilter" class="form-select">
            <option value="">All Constituencies</option>
          </select>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-12 text-end">
          <button class="btn btn-primary me-2">Search</button>
          <button class="btn btn-secondary" disabled="">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <div id="card-container-members" class="row g-4"></div>
</div>

<div class="modal fade" id="membersModal" tabindex="-1" aria-labelledby="membersModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-4">
            <img id="modal-image" class="img-fluid rounded" alt="">
          </div>
          <div class="col-md-8">
            <div id="modal-body"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="loading-overlay position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center"
  style="display: none; background-color: rgba(255, 255, 255, 0.8); z-index: 9999;" id="loading-overlay">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const searchInput = document.querySelector('.form-control');
    const parliamentFilter = document.getElementById('parliamentFilter');
    const constituencyFilter = document.getElementById('constituencyFilter');
    const searchButton = document.querySelector('.btn-primary');
    const resetButton = document.querySelector('.btn-secondary');

    function mapDesignation(designationNumber) {
      const designationMap = {
        '1': 'Speaker',
        '2': 'Prime Minister',
        '3': 'Cabinet Minister',
        '4': 'Ruling Member',
        '5': 'Opposition Leader',
        '6': 'Opposition Member',
        '7': 'Dy. Speaker'
      };
      return designationMap[designationNumber] || 'Unknown Designation';
    }

    function fetchData() {
      showLoading();
      const searchValue = searchInput.value.trim().toLowerCase();
      const selectedParliament = parliamentFilter.value || "Third Parliament";
      const selectedConstituency = constituencyFilter.value || "";

      fetch('https://parliament.bt/api/v1/topics/12/page/1/count/500')
        .then(response => response.text())
        .then(text => {
          // Remove any HTML or script tags before the JSON
          const jsonStart = text.indexOf('{');
          if (jsonStart === -1) {
            throw new Error('Invalid response format');
          }
          const cleanedText = text.slice(jsonStart);
          return JSON.parse(cleanedText);
        })
        .then(data => {
          let filteredData = data.topics.filter(topic => {
            const matchesParliament = topic.Joined_categories.some(cat => cat.title === selectedParliament);
            const matchesConstituency = selectedConstituency === "" || topic.Joined_categories.some(cat => cat.title === selectedConstituency);
            const matchesSearch = searchValue === "" || topic.title.toLowerCase().includes(searchValue);
            return matchesParliament && matchesConstituency && matchesSearch;
          });

          filteredData = filteredData.map(topic => ({
            ...topic,
            designation: mapDesignation(topic.fields.find(field => field.title === 'Designation')?.value || 'N/A'),
            partyAffiliation: topic.fields.find(field => field.title === 'Party Affiliation')?.value || 'Party NA',
            parliamentLabel: topic.Joined_categories.find(cat => cat.title.includes('Parliament'))?.title || 'No Parliament',
            constituency: topic.Joined_categories.find(cat => !cat.title.includes('Parliament') && cat.title !== 'Speaker' && cat.title !== topic.designation)?.title || 'No Constituency',
            email: topic.fields.find(field => field.type === 3)?.value || '',
            phone: topic.fields.find(field => field.title === 'Phone Number')?.value || '',
            sortingOrder: parseInt(topic.fields.find(field => field.title === 'Sorting Order')?.value || '9999')
          }));

          filteredData.sort((a, b) => a.sortingOrder - b.sortingOrder);

          displayMembers(filteredData);
          hideLoading();
        })
        .catch(error => {
          console.error('Error:', error);
          hideLoading();
          // Display error message to the user
          const cardContainer = document.getElementById('card-container-members');
          cardContainer.innerHTML = `
                    <div class="col-12 text-center mt-5">
                        <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                        <h4 class="text-danger">Error loading data. Please try again later.</h4>
                    </div>
                `;
        });
      resetButton.removeAttribute('disabled');
    }

    function displayMembers(members) {
      const cardContainer = document.getElementById('card-container-members');
      cardContainer.innerHTML = '';

      if (members.length > 0) {
        members.forEach(member => {
          const cardCol = document.createElement('div');
          cardCol.classList.add('col-md-3', 'col-sm-6', 'col-xs-6', 'mb-3');

          const card = document.createElement('div');
          card.classList.add('card', 'h-100');

          card.innerHTML = `
                    <div class="card-header text-center py-3">
                        <h5 class="mb-0">${member.designation}</h5>
                    </div>
                    <div class="card-body text-center d-flex flex-column justify-content-between">
                        <div>
                            <img src="${member.photo_file}" alt="${member.title}" class="crd-img mb-3">
                            <h6 class="mb-2">${member.title}</h6>
                            <p class="mb-2 text-muted">${member.partyAffiliation}</p>
                            <p class="mb-2 small">${member.parliamentLabel}</p>
                            <p class="mb-2 small">${member.constituency}</p>
                        </div>
                        <div class="mt-3">
                            ${member.email ? `<a href="mailto:${member.email}" class="btn btn-sm btn-outline-primary mb-2"><i class="fas fa-envelope me-2"></i>Email</a>` : ''}
                            ${member.phone ? `<a href="tel:${member.phone}" class="btn btn-sm btn-outline-secondary"><i class="fas fa-phone me-2"></i>Call</a>` : ''}
                        </div>
                    </div>
                `;

          card.addEventListener('click', () => showDetailsModal(member));

          cardCol.appendChild(card);
          cardContainer.appendChild(cardCol);
        });
      } else {
        const noMembersMessage = document.createElement('div');
        noMembersMessage.classList.add('col-12', 'text-center', 'mt-5');
        noMembersMessage.innerHTML = `
                <i class="fas fa-search fa-3x text-muted mb-3"></i>
                <h4 class="text-muted">No Members found</h4>
            `;
        cardContainer.appendChild(noMembersMessage);
      }
    }

    function resetFilters() {
      searchInput.value = '';
      parliamentFilter.selectedIndex = 2;
      constituencyFilter.selectedIndex = 0;
      fetchData();
      resetButton.setAttribute('disabled', 'true');
    }

    searchButton.addEventListener('click', fetchData);
    resetButton.addEventListener('click', resetFilters);
    fetchData();
    resetButton.setAttribute('disabled', 'true');
  });
  function showLoading() {
    document.getElementById('loading-overlay').style.display = 'flex';
  }

  function hideLoading() {
    const loadingOverlay = document.getElementById('loading-overlay');

    loadingOverlay.style.setProperty('display', 'none', 'important');
    loadingOverlay.style.setProperty('z-index', '-9999', 'important');
  }


  function showDetailsModal(selectedTopic) {
    const modalTitle = document.getElementById('modal-title');
    const modalImage = document.getElementById('modal-image');
    const modalBody = document.getElementById('modal-body');

    modalTitle.textContent = selectedTopic.title;
    modalImage.src = selectedTopic.photo_file;
    modalImage.alt = selectedTopic.title;

    modalBody.innerHTML = '';

    const detailsContainer = document.createElement('div');
    detailsContainer.classList.add('card', 'border-0');

    selectedTopic.fields.forEach(field => {
      const detailItem = document.createElement('div');
      detailItem.classList.add('row', 'mb-2');

      const detailTitle = document.createElement('div');
      detailTitle.classList.add('col-sm-4', 'fw-bold');
      detailTitle.textContent = field.title;

      const detailValue = document.createElement('div');
      detailValue.classList.add('col-sm-8');

      switch (field.title) {
        case 'Designation':
          detailValue.textContent = mapDesignation(field.value);
          break;
        case 'Email':
          const emailLink = document.createElement('a');
          emailLink.href = `mailto:${field.value}`;
          emailLink.textContent = field.value;
          detailValue.appendChild(emailLink);
          break;
        default:
          detailValue.textContent = field.value;
          break;
      }

      detailItem.appendChild(detailTitle);
      detailItem.appendChild(detailValue);
      detailsContainer.appendChild(detailItem);
    });

    modalBody.appendChild(detailsContainer);
    new bootstrap.Modal(document.getElementById('membersModal')).show();
  }

  function mapDesignation(designationNumber) {
    const designationMap = {
      '1': 'Speaker',
      '2': 'Prime Minister',
      '3': 'Cabinet Minister',
      '4': 'Ruling Member',
      '5': 'Opposition Leader',
      '6': 'Opposition Member',
      '7': 'Dy. Speaker'
    };
    return designationMap[designationNumber] || 'Unknown Designation';
  }

</script>
